services:
  postgres:
    image: postgres:16
    container_name: robotics-postgres
    environment:
      POSTGRES_DB: robotics_education
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - robotics_pgdata:/var/lib/postgresql/data
volumes:
  robotics_pgdata:
