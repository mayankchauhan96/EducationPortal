services:
  postgres:
    image: postgres:16
    container_name: robotics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robotics_education}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - robotics_pgdata:/var/lib/postgresql/data
volumes:
  robotics_pgdata:
